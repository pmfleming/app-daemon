[package]
name = "app-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Application catalog and activation daemon for Shelllist"
repository = "https://github.com/pmfleming/app-daemon"

[features]
benchmarks = ["dep:allocation-counter", "dep:tempfile"]

[dependencies]
allocation-counter = { version = "0.8.1", optional = true }
tempfile = { version = "3", optional = true }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
freedesktop-desktop-entry = { version = "0.8.1", default-features = false }
futures = "0.3"
notify = "8"
rustix = { version = "1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shelllist-daemon-core = { path = "../daemon-framework/crates/shelllist-daemon-core" }
shelllist-daemon-tokio = { path = "../daemon-framework/crates/shelllist-daemon-tokio" }
shelllist-hyprland = { path = "../shelllist-hyprland" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zbus = { version = "5", features = ["tokio"] }

[[bench]]
name = "workloads"
harness = false
required-features = ["benchmarks"]

[dev-dependencies]
rustix = { version = "1", features = ["process"] }
tempfile = "3"
