project_name = "app-daemon"
project_root = ".."
output_dir = "target/quality-regression"
# Include non-Rust fixtures that affect executable contract tests.
fingerprint_inputs = ["test_support"]

[rust]
identity_resolution = "auto"
rust_analyzer = "rust-analyzer"
identity_timeout_seconds = 60
identity_offline = true

[verification]
locked = true
timeout_seconds = 600
workspace = true
all_targets = true
all_features = true
audit = false
deny = false
semver = false
feature_matrix = false
miri = false
