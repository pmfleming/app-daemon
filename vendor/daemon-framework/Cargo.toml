[workspace]
resolver = "3"
members = [
  "crates/shelllist-daemon-core",
  "crates/shelllist-daemon-tokio",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/pmfleming/daemon-framework"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
